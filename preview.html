<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Badge preview — IMDb Ratings for Netflix</title>

  <!-- The real stylesheet the extension injects. Nothing is duplicated here,
       so this page is always an honest preview of the shipping badge. -->
  <link rel="stylesheet" href="content.css">

  <style>
    /* Everything below only fakes Netflix's surroundings so the badge can be
       judged in context. None of it ships. */
    body {
      margin: 0;
      padding: 32px 0 48px;
      background: #141414;
      color: #fff;
      font-family: "Netflix Sans", Helvetica, Arial, sans-serif;
    }
    h1 { margin: 0 32px 4px; font-size: 20px; font-weight: 700; }
    .sub { margin: 0 32px 28px; font-size: 13px; color: #8c8c8c; }
    h2 { margin: 0 32px 10px; font-size: 15px; font-weight: 600; color: #e5e5e5; }
    .row { display: flex; gap: 6px; padding: 0 32px 30px; overflow-x: auto; }
    .title-card { flex: 0 0 220px; }
    .boxart-container {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }
    .art { position: absolute; inset: 0; }
    .name {
      position: relative;
      z-index: 2;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
    }
    .scrim { position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(to top, rgba(0,0,0,.75), transparent 55%); }
    .legend { margin: 8px 32px 0; display: flex; gap: 18px; flex-wrap: wrap;
      font-size: 12.5px; color: #a3a3a3; align-items: center; }
    .legend .nrx-badge { position: static; }
    .legend span { display: inline-flex; align-items: center; gap: 7px; }
  </style>
</head>
<body>
  <h1>Badge preview</h1>
  <p class="sub">Fake Netflix rows, real stylesheet. This is how the extension will look on a live page.</p>

  <h2>Trending Now</h2>
  <div class="row" id="row-a"></div>

  <h2>Because you watched Dune</h2>
  <div class="row" id="row-b"></div>

  <div class="legend">
    <span><span class="nrx-badge" data-tier="high">8.4</span> 7.5 and above</span>
    <span><span class="nrx-badge" data-tier="mid">6.9</span> 6.5 – 7.4</span>
    <span><span class="nrx-badge" data-tier="low">5.2</span> below 6.5</span>
    <span><span class="nrx-badge" data-tier="unknown">—</span> no rating found</span>
  </div>

  <script>
    // Stand-in for what background.js returns from the IMDb dataset.
    const rows = {
      "row-a": [
        { name: "The Dark Knight",      rating: "9.0", votes: 3012044, year: 2008, art: "#1c2b3a,#0d1218" },
        { name: "Rebel Moon",           rating: "5.6", votes: 118203,  year: 2023, art: "#3a2438,#150d16" },
        { name: "Arcane",               rating: "9.0", votes: 348912,  year: 2021, art: "#2b1f4a,#120d21" },
        { name: "Red Notice",           rating: "6.3", votes: 244010,  year: 2021, art: "#4a3320,#1a120a" },
        { name: "Nimona",               rating: "7.5", votes: 78221,   year: 2023, art: "#1f3a3a,#0c1919" }
      ],
      "row-b": [
        { name: "Laapataa Ladies",      rating: "8.3", votes: 61964, year: 2023, label: "Lost Ladies", art: "#4a2a1c,#1a0f0a" },
        { name: "My Liberation Notes",  rating: "8.2", votes: 7584,  year: 2022, label: "My Liberation Diary", art: "#1c3a2a,#0b1a12" },
        { name: "The Midnight Sky",     rating: "5.6", votes: 92104, year: 2020, art: "#2a3040,#10131b" },
        { name: "Hustle 5",             rating: null,  art: "#2e2e2e,#141414" },
        { name: "Interstellar",         rating: "8.7", votes: 2284119, year: 2014, art: "#20304a,#0c121d" }
      ]
    };

    // Mirrors the tooltip logic in content.js so the harness shows the real
    // thing rather than an approximation of it.
    let tipElement = null;
    function ensureTip() {
      if (tipElement && tipElement.isConnected) return tipElement;
      tipElement = document.createElement("div");
      tipElement.className = "nrx-tip";
      tipElement.hidden = true;
      document.body.appendChild(tipElement);
      return tipElement;
    }
    function showTip(badge) {
      const text = badge.dataset.tip;
      if (!text) return;
      const tip = ensureTip();
      tip.textContent = text;
      tip.hidden = false;
      const anchor = badge.getBoundingClientRect();
      const box = tip.getBoundingClientRect();
      let left = anchor.left + anchor.width / 2 - box.width / 2;
      left = Math.max(8, Math.min(left, window.innerWidth - box.width - 8));
      let top = anchor.top - box.height - 8;
      if (top < 8) top = anchor.bottom + 8;
      tip.style.left = `${Math.round(left)}px`;
      tip.style.top = `${Math.round(top)}px`;
    }
    function hideTip() { if (tipElement) tipElement.hidden = true; }
    window.showTip = showTip; window.hideTip = hideTip;

    const TIER_HIGH = 7.5, TIER_MID = 6.5;
    function tierFor(r) {
      const v = parseFloat(r);
      if (Number.isNaN(v)) return "unknown";
      if (v >= TIER_HIGH) return "high";
      if (v >= TIER_MID) return "mid";
      return "low";
    }

    for (const [rowId, items] of Object.entries(rows)) {
      const row = document.getElementById(rowId);
      for (const item of items) {
        const [c1, c2] = item.art.split(",");
        const card = document.createElement("div");
        card.className = "title-card";
        card.innerHTML = `
          <div class="boxart-container nrx-host">
            <div class="art" style="background:linear-gradient(145deg,${c1},${c2})"></div>
            <div class="scrim"></div>
            <div class="name">${item.name}</div>
          </div>`;
        const badge = document.createElement("div");
        badge.className = "nrx-badge";
        badge.dataset.tier = tierFor(item.rating);
        badge.textContent = item.rating ?? "—";

        if (item.rating) {
          const bits = [`IMDb ${item.rating}`];
          if (item.votes) bits.push(`${item.votes.toLocaleString()} votes`);
          if (item.year) bits.push(String(item.year));
          let tip = bits.join(" · ");
          if (item.label) tip += `\n${item.label}  (closest match)`;
          badge.dataset.tip = tip;
        } else {
          badge.dataset.tip = "No IMDb rating found";
        }
        badge.addEventListener("mouseenter", () => showTip(badge));
        badge.addEventListener("mouseleave", hideTip);

        card.querySelector(".boxart-container").appendChild(badge);
        row.appendChild(card);
      }
    }
  </script>
</body>
</html>
