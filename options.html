<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IMDb Ratings for Netflix — Settings</title>
  <style>
    :root { color-scheme: dark; }
    body {
      width: 320px;
      margin: 0;
      padding: 18px;
      background: #181818;
      color: #f2f2f2;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    h1 { margin: 0 0 4px; font-size: 15px; }
    p  { margin: 0 0 14px; color: #a3a3a3; font-size: 12.5px; }
    a  { color: #7ab8ff; }
    label { display: block; margin-bottom: 6px; font-size: 12px; color: #a3a3a3; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      background: #262626;
      color: #f2f2f2;
      font: inherit;
      font-variant-numeric: tabular-nums;
    }
    input:focus { outline: none; border-color: #7ab8ff; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button {
      flex: 1;
      padding: 8px 10px;
      border: 0;
      border-radius: 4px;
      background: #e50914;
      color: #fff;
      font: 600 13px/1 inherit;
      cursor: pointer;
    }
    button.secondary { background: #333; color: #ccc; }
    button:hover { filter: brightness(1.1); }
    #status { margin-top: 12px; min-height: 18px; font-size: 12.5px; color: #46d369; }
    #status[data-kind="error"] { color: #e87c78; }
  </style>
</head>
<body>
  <h1>IMDb Ratings for Netflix</h1>
  <p>
    Needs a free OMDb API key —
    <a href="https://www.omdbapi.com/apikey.aspx" target="_blank" rel="noreferrer">get one here</a>
    (free tier, 1,000 lookups a day).
  </p>

  <label for="key">OMDb API key</label>
  <input id="key" type="text" placeholder="e.g. 1a2b3c4d" spellcheck="false" autocomplete="off">

  <div class="row">
    <button id="save">Save</button>
    <button id="clear" class="secondary">Clear cache</button>
  </div>

  <div id="status" role="status"></div>

  <script src="options.js"></script>
</body>
</html>
