<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IMDb Ratings for Netflix — Settings</title>
  <style>
    :root { color-scheme: dark; }
    body {
      width: 330px;
      margin: 0;
      padding: 18px;
      background: #181818;
      color: #f2f2f2;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    h1 { margin: 0 0 4px; font-size: 15px; }
    h2 { margin: 0 0 4px; font-size: 13px; }
    p  { margin: 0 0 14px; color: #a3a3a3; font-size: 12.5px; }
    label { display: block; margin-bottom: 6px; font-size: 12px; color: #a3a3a3; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      background: #262626;
      color: #f2f2f2;
      font: inherit;
      font-variant-numeric: tabular-nums;
    }
    input:focus { outline: none; border-color: #7ab8ff; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button {
      flex: 1;
      padding: 8px 10px;
      border: 0;
      border-radius: 4px;
      background: #e50914;
      color: #fff;
      font: 600 13px/1 inherit;
      cursor: pointer;
    }
    button.secondary { background: #333; color: #ccc; }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: .5; cursor: default; filter: none; }
    hr { margin: 18px 0 14px; border: 0; border-top: 1px solid #2e2e2e; }

    .state {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 11px; border-radius: 4px; background: #101010;
      font-size: 12.5px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #8c8c8c; flex: none; }
    .state[data-ok="yes"] .dot { background: #46d369; }
    .state[data-ok="busy"] .dot { background: #e5a00d; }
    .state[data-ok="no"]  .dot { background: #e87c78; }

    .thresholds { display: flex; gap: 10px; }
    .thresholds div { flex: 1; }
    .swatch {
      display: flex; align-items: center; gap: 8px;
      margin-top: 4px; padding: 6px 8px;
      border-radius: 4px; background: #101010;
      font-size: 12px; color: #a3a3a3;
    }
    .chip {
      padding: 2px 7px; border-radius: 4px;
      background: rgba(0,0,0,.82); box-shadow: inset 0 0 0 1px currentColor;
      font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .chip.high { color: #46d369; } .chip.mid { color: #e5a00d; }
    .chip.low  { color: #e87c78; }
    #status { margin-top: 12px; min-height: 18px; font-size: 12.5px; color: #46d369; }
    #status[data-kind="error"] { color: #e87c78; }
  </style>
</head>
<body>
  <h1>IMDb Ratings for Netflix</h1>
  <p>No API key needed — ratings come from IMDb's own published dataset.</p>

  <h2>Ratings data</h2>
  <div class="state" id="dataState" data-ok="no">
    <span class="dot"></span><span id="dataText">Checking…</span>
  </div>
  <div class="row">
    <button id="refresh">Refresh dataset</button>
    <button id="clearTitles" class="secondary">Clear matches</button>
  </div>

  <hr>

  <h2>Rating colours</h2>
  <p>Where green becomes amber, and amber becomes red.</p>

  <div class="thresholds">
    <div>
      <label for="high">Green at or above</label>
      <input id="high" type="number" min="0" max="10" step="0.1" inputmode="decimal">
    </div>
    <div>
      <label for="mid">Amber at or above</label>
      <input id="mid" type="number" min="0" max="10" step="0.1" inputmode="decimal">
    </div>
  </div>

  <div class="swatch"><span class="chip high" id="egHigh">8.4</span> <span id="txtHigh"></span></div>
  <div class="swatch"><span class="chip mid"  id="egMid">6.9</span> <span id="txtMid"></span></div>
  <div class="swatch"><span class="chip low"  id="egLow">5.2</span> <span id="txtLow"></span></div>

  <div class="row">
    <button id="saveTiers">Save colours</button>
    <button id="resetTiers" class="secondary">Reset</button>
  </div>

  <div id="status" role="status"></div>

  <script src="defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
